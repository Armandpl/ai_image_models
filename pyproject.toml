[project]
name = "ai-image-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.5.0",
    "einops>=0.8.2",
    "jupyter>=1.1.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.9.0",
    "pytorch-ignite>=0.5.3",
    "timm>=1.0.25",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_image_models"]
